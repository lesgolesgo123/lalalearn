function askQ(box,q,{head='',onDone}){
  const t0=performance.now(),tone=P.tone||'gentle';let done=false,hinted=false;
  box.innerHTML=`${head}<h2 class="qtext" id="qp">${esc(q.prompt)}</h2><div class="vis">${q.vis}</div>
   <div class="opts" id="qo">${q.opts.map(o=>`<button class="qopt" data-id="${esc(o.id)}" aria-label="${esc(o.label)}">${o.html}</button>`).join('')}</div>
   <div class="row"><button class="btn sm ghost" id="qhear">${ic('vol',16)} Hear it</button><button class="btn sm ghost" id="qhint">Hint</button></div><div id="qfb" aria-live="polite"></div>`;
  $('#qhear').onclick=()=>{if(!say(q.spoken))toast('Your device cannot read aloud here.')};
  $('#qhint').onclick=()=>{if(hinted||done)return;hinted=true;const w=shuffle($$('.qopt',box).filter(b=>b.dataset.id!==q.ans))[0];if(w)w.classList.add('gone');$('#qfb').innerHTML='<div class="fb"><span>One went away.</span></div>';$('#qhint').disabled=true};
  if(P.prefs.voice)setTimeout(()=>say(q.spoken),350);
  $$('.qopt',box).forEach(b=>b.onclick=()=>{
    if(done)return;done=true;const ok=b.dataset.id===q.ans,ms=performance.now()-t0;
    $$('.qopt',box).forEach(x=>{x.disabled=true;if(x.dataset.id===q.ans&&!ok)x.classList.add('right')});b.classList.add(ok?'right':'soft');
    $('#qhint').disabled=true;onDone(ok,ms,msg=>{$('#qfb').innerHTML=msg})

    $('#skyHint').remove();const field=$('#sky'),seq=shuffle(['star','star','star','star','star','star','star','cloud','cloud','cloud']);let i=0,hits=0,bad=0;

function x3Layout(n,a,sp){
  const rows=a<.8&&n>3?2:1,per=Math.ceil(n/rows),out=[];
  for(let k=0;k<n;k++){const r=Math.floor(k/per),c=k%per,inRow=r===rows-1?n-r*per:per;out.push([(c-(inRow-1)/2)*sp,(r-(rows-1)/2)*sp*1.5])}
  return out;
}

      a.g.userData.to=a.g.userData.home.clone().add(new T.Vector3(0,.5,0));a.g.userData.ts=1.1;

function x3Spell(T){

  x3Run(S,{skill:'read',mode:'spell',round(S,finish){

    const n=letters.length,sp=1.2,slotX=k=>(k-(word.length-1)/2)*sp,tall=S.aspect<.8&&n>3,spos=x3Layout(n,S.aspect,1.25);

R.world=arg=>{

   <div class="card stack" style="gap:18px;align-items:center;text-align:center;padding:30px 22px"><span class="sdgbig" style="--bg:${c[0]};--fg:${c[1]}" aria-hidden="true">${n}</span><h2 style="font-size:clamp(1.6rem,4vw,2.4rem)">${esc(g[1])}</h2><p class="wtext" style="max-width:26ch">${esc(g[2])}</p>

function wSlides(t,i){

  $('#page').innerHTML=`<div class="wrap stack" style="gap:18px;max-width:760px"><div class="row between">${backBtn('world','All topics')}<div class="row" style="gap:10px">${stepTxt(i+1,n)}<span class="chip">${esc(t.n)}</span></div></div>

    <div class="row" style="justify-content:center"><button class="btn sm ghost" id="whear">${ic('vol',16)} Hear it</button>${t.id==='peace'?`<button class="btn sm sun" id="wcalm">${ic('heart',16)} Calm break</button>${signChip('calm')}`:''}</div>${needs().autism&&i===0?'<span class="muted small">First read. Then a quiz.</span>':''}</div>
   <div class="row between">${i?'<button class="btn" id="wprev">Back</button>':'<span></span>'}<button class="btn pri lg" id="wnext">${last?'Quiz time':'Next'} ${ic('arrow',18)}</button></div></div>`;
  $('#whear').onclick=()=>{if(!say(s[1]))toast('Your device cannot read aloud here.')};
  const wc=$('#wcalm');if(wc)wc.onclick=()=>{today().breaks++;save();openCalm()};

}
let WQ=null;
function wStart(id){

  WQ={id,t,n:0,total:t?Math.min(cnt,t.qs.length):cnt,correct:0,hist:[],times:[],bag:t?shuffle(t.qs):[],lvl:lvlOf(G.mastery.know),breakOffered:false,p0:plantCount()};
  wQ();
}
function sdgQ(l){
  const g=pick(SDG),oth=shuffle(SDG.filter(x=>x[0]!==g[0])).slice(0,2),t=pick(l<=1?['a','b']:l===2?['a','b','c']:['a','b','c','d']);
  const nm=x=>({id:String(x[0]),html:`<span class="tx">${esc(x[1])}</span>`,label:x[1]});
  if(t==='b'){const o=[g,...oth];return{skill:'know',prompt:'What can we do for “'+g[1]+'”?',spoken:'What can we do for '+g[1]+'?',vis:wico('globe'),opts:shuffle(o).map(x=>({id:String(x[0]),html:`<span class="tx">${esc(x[3])}</span>`,label:x[3]})),ans:String(g[0])}}
  if(t==='c'){const nums=shuffle([g[0],...oth.map(x=>x[0])]);return{skill:'know',prompt:'Which number is “'+g[1]+'”?',spoken:'Which number is '+g[1]+'?',vis:wico('globe'),opts:nums.map(v=>({id:String(v),html:String(v),label:String(v)})),ans:String(g[0])}}
  if(t==='d')return{skill:'know',prompt:'Goal '+g[0]+' is…',spoken:'Goal '+g[0]+' is',vis:`<span class="sdgbig" style="--bg:${sdgCol(g[0])[0]};--fg:${sdgCol(g[0])[1]}" aria-hidden="true">${g[0]}</span>`,opts:shuffle([g,...oth]).map(nm),ans:String(g[0])};
  return{skill:'know',prompt:'Which goal is this?',spoken:g[2]+' Which goal is this?',vis:`<p class="wtext" style="text-align:center;max-width:24ch">${esc(g[2])}</p>`,opts:shuffle([g,...oth]).map(nm),ans:String(g[0])};
}

  if(!WQ.t)return sdgQ(WQ.lvl);
  const[p,r,ws]=WQ.bag[WQ.n],big=w=>w.length<=3;
  return{skill:'know',prompt:p,spoken:p,vis:wico(WQ.t.ic),opts:shuffle([r,...ws]).map(w=>({id:w,html:big(w)?`<span class="tx" style="font:600 1.6rem var(--f-d)">${esc(w)}</span>`:`<span class="tx">${esc(w)}</span>`,label:w})),ans:r};
}
function wQ(){
  const q=wMake(),name=WQ.t?WQ.t.n:'17 Global Goals';
  const head=`<div class="row between"><span class="chip">${esc(name)}</span><div class="row" style="gap:12px">${stepTxt(WQ.n+1,WQ.total)}<div class="stars" aria-label="Question ${WQ.n+1} of ${WQ.total}">${Array.from({length:WQ.total},(_,i)=>`<i class="${i<WQ.correct?'on':''}"></i>`).join('')}</div></div></div>`;
  $('#page').innerHTML=`<div class="wrap stack" style="gap:20px;max-width:760px"><div class="card stack" id="qbox" style="gap:20px"></div></div>`;
  askQ($('#qbox'),q,{head,onDone(ok,ms,setFb){
    WQ.times.push(ms);WQ.hist.push(ok);WQ.n++;if(ok)WQ.correct++;recordAnswer('know',ok);
    const l2=WQ.hist.slice(-2),l3=WQ.hist.slice(-3);
    if(!WQ.t){if(l2.length===2&&l2.every(Boolean))WQ.lvl=Math.min(4,WQ.lvl+1);if(l2.length===2&&l2.every(h=>!h))WQ.lvl=Math.max(1,WQ.lvl-1)}
    const slow=WQ.times.length>=4&&avg(WQ.times.slice(-2))>2*avg(WQ.times.slice(0,2));
    const tired=((l3.length===3&&l3.every(h=>!h))||slow)&&WQ.n<WQ.total&&!WQ.breakOffered;
    const msg=ok?praiseTxt():tryTxt();
    if(tired){WQ.breakOffered=true;G.breaks++;today().breaks++;save();
      setFb(`<div class="fb"><strong>${msg}</strong><p>${breakTxt()}</p>${signChip('calm')}<div class="row"><button class="btn sun" id="brk">Calm break</button><button class="btn ghost" id="cont">Keep going</button></div></div>`);
      $('#brk').onclick=()=>{openCalm();wNext()};$('#cont').onclick=wNext;
    }else{
      setFb(`<div class="fb"><strong>${msg}</strong>${ok?signChip('good'):''}<button class="btn pri" id="nx">${WQ.n>=WQ.total?'Finish':'Next'} ${ic('arrow',17)}</button></div>`);$('#nx').onclick=wNext;$('#nx').focus();
    }
    if(ok&&P.prefs.voice)say(msg);
  }});
}
function wNext(){WQ.n>=WQ.total?wEnd():wQ()}
function wEnd(){
  const pts=WQ.correct*10;G.wd=G.wd||{};G.wd[WQ.id]=Math.max(G.wd[WQ.id]||0,WQ.correct);today().lessons++;G.lessons++;touchDay();save();
  const grew=plantCount()>WQ.p0,again=WQ.t?'world-'+WQ.t.id:'world-sdg-quiz';
  $('#page').innerHTML=`<div class="wrap stack" style="gap:20px;max-width:760px"><div class="card stack" style="gap:20px;align-items:flex-start"><div class="pipline">${pip(96)}<p class="say">${doneTxt()}</p>${signChip('done')}</div>
   <div class="stars big" aria-label="${WQ.correct} of ${WQ.total} stars">${Array.from({length:WQ.total},(_,i)=>`<i class="${i<WQ.correct?'on':''}" style="animation-delay:${i*120}ms"></i>`).join('')}</div>
   <p><b>+${pts} ★</b> ${grew?'· New plant!':''}</p><p class="muted">Thank you for caring about our world.</p>
   ${minsToday()>=P.att?`<div class="fb"><strong>Time for a calm break</strong></div>`:''}
   <div class="row"><button class="btn pri" data-go="world">More topics</button><button class="btn" data-go="${again}">Again</button><button class="btn sun" id="lbrk">${ic('heart',17)} Calm break</button><button class="btn ghost" data-go="dashboard">Home</button></div></div></div>`;
  $('#lbrk').onclick=()=>{today().breaks++;save();openCalm()};
}


const ev=k=>k==='talk'?G.speaks:(G.st[k]?G.st[k][0]:0);
const bump=k=>{const t=G.st[k]||(G.st[k]=[0,0]);t[0]++;t[1]++};
const GOALS=[['Counts a group of objects up to 10','Number','num',70,45],['Matches a pictured word to its written form','Early reading','read',70,45],['Continues a simple repeating pattern','Reasoning','pat',70,45],['Names common feelings and calm-down ideas','Wellbeing','feel',70,45],['Talks about caring for the planet and for others','World knowledge','know',70,45],['Stays with a short task for five minutes','Attention','att',65,40],['Uses picture cards to make a request','Communication','talk',60,40]];
function weekChart(){
  const vals=[],days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);vals.push(Math.round((G.mins[dstr(d)]||0)/6)/10);days.push(d.toLocaleDateString('en-GB',{weekday:'short'}))}
  const W0=560,H=230,pl=34,pr=10,pt=18,pb=30,ih=H-pt-pb,max=Math.max(6,Math.ceil(Math.max(...vals))),step=max<=6?2:Math.ceil(max/3),bw=(W0-pl-pr)/7;let g='';
  for(let v=0;v<=max;v+=step){const y=pt+ih*(1-v/max);g+=`<line x1="${pl}" x2="${W0-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v}</text>`}
  const gy=pt+ih*(1-5/max);g+=`<line x1="${pl}" x2="${W0-pr}" y1="${gy}" y2="${gy}" stroke="var(--sun)" stroke-width="2" stroke-dasharray="6 5"/>`;
  vals.forEach((v,i)=>{const h=ih*(v/max),x=pl+i*bw+bw*.2,w=bw*.6,y=pt+ih-h;g+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,0)}" rx="5" fill="${i===6?'var(--sun)':'var(--brand2)'}"/>${v?`<text class="v" x="${x+w/2}" y="${y-5}" text-anchor="middle">${v}</text>`:''}<text x="${x+w/2}" y="${H-10}" text-anchor="middle">${days[i]}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W0} ${H}" role="img" aria-label="Minutes learned in the last seven days">${g}</svg>`;
}
function reportText(){
  const lv=LVNAME[lvlOf(avg([G.mastery.read,G.mastery.num]))-1];
  return `LaLaLearn progress summary for ${P.name}\nLevel: ${lv}\nDays in a row: ${effStreak(G)}\nLearning time today: ${minsToday()} min\nLessons completed: ${G.lessons}\nWorld topics explored: ${Object.keys(G.wd||{}).length} of ${WTOP.length+1}\n\nSkills:\n${Object.keys(SKN).map(k=>`- ${SKN[k]}: ${Math.round(G.mastery[k])}%`).join('\n')}\n\nGoal progress:\n${GOALS.map(x=>{const v=G.mastery[x[2]];return `- ${x[0]}: ${ev(x[2])<5?'Getting started':v>=x[3]?'Secure':v>=x[4]?'Working on it':'Needs support'}`}).join('\n')}\n\nWellbeing:\n- Calm breaks suggested: ${G.breaks}\n- Calming Corner used: ${G.calm} times${G.notes?`\n\nNotes:\n${G.notes}`:''}`;
}
R.care=()=>{
  const skills=Object.keys(SKN).map(k=>{const v=Math.round(G.mastery[k]),tg=ev(k)<5?'<span class="tag" style="color:var(--muted)">Getting started</span>':v>=65?'<span class="tag good">Strength</span>':v>=45?'<span class="tag mid">Steady</span>':'<span class="tag need">Needs support</span>';return `<div class="skill"><span>${SKN[k]}</span><div class="meter" role="img" aria-label="${SKN[k]} ${v} percent"><i data-w="${v}"></i></div>${tg}</div>`}).join('');
  const goals=GOALS.map(x=>{const v=G.mastery[x[2]],st=ev(x[2])<5?'<span class="tag" style="color:var(--muted)">Getting started</span>':v>=x[3]?'<span class="tag good">Secure</span>':v>=x[4]?'<span class="tag mid">Working on it</span>':'<span class="tag need">Needs support</span>';return `<tr><td>${x[0]}</td><td>${x[1]}</td><td>${st}</td></tr>`}).join('');
  const acc=(()=>{let a=0,c=0;Object.values(G.st).forEach(s=>{a+=s[0];c+=s[1]});return a?Math.round(c/a*100)+'%':'–'})();
  const used=Object.keys(P.prefs).filter(k=>P.prefs[k]).map(k=>PREFS.find(x=>x[0]===k)[1]);
  $('#page').innerHTML=`<div class="wrap stack" style="gap:22px"><div class="row between"><div class="stack" style="gap:4px"><span class="muted">For parents, teachers and therapists</span><h2>${sp('Care Circle for '+P.name)}</h2></div><div class="row" style="gap:8px"><button class="btn sm" data-go="profile">${ic('gear',15)} Settings</button></div></div>
   ${P.plan!=='family'?`<button class="promo rv" data-go="pricing" style="border:0;text-align:left;cursor:pointer"><span class="ti2" aria-hidden="true">${ic('star',18)}</span><span>Family RM12 <span class="was">RM25</span></span><span class="chip" style="background:var(--on-sun);color:var(--sun)">See plans</span></button>`:''}
   <dl class="kpis rv"><div><dt>Level</dt><dd>${LVNAME[lvlOf(avg([G.mastery.read,G.mastery.num]))-1]}</dd></div><div><dt>Days in a row</dt><dd class="tn">${effStreak(G)}</dd></div><div><dt>Today</dt><dd class="tn">${minsToday()} min</dd></div><div><dt>Lessons</dt><dd class="tn">${G.lessons}</dd></div><div><dt>World topics</dt><dd class="tn">${Object.keys(G.wd||{}).length} of ${WTOP.length+1}</dd></div><div><dt>Answers right</dt><dd class="tn">${acc}</dd></div></dl>
   <div class="g2"><div class="card rv stack" style="gap:12px"><b>Minutes this week</b>${weekChart()}<span class="muted small">Dashed line marks 5 minutes a day.${Object.keys(G.mins).length?'':' Nothing recorded yet. Time appears here once your child starts learning.'}</span></div>
   <div class="card rv stack" style="--d:1;gap:14px"><b>Strengths and support needs</b>${skills}<span class="muted small">Scores come from lessons, games, study sprints and Talk use. A skill shows Getting started until there are five answers or activities.</span></div></div>
   <div class="stack" style="gap:12px"><h3>Learning goals</h3><div class="tblw rv"><table><thead><tr><th>Goal</th><th>Area</th><th>Status</th></tr></thead><tbody>${goals}</tbody></table></div></div>
   <div class="g2"><div class="card rv stack" style="gap:12px"><b>Wellbeing signals</b><dl class="kpis"><div><dt>Breaks suggested</dt><dd class="tn">${G.breaks}</dd></div><div><dt>Calming Corner</dt><dd class="tn">${G.calm}</dd></div><div><dt>Focus today</dt><dd class="tn">${focusPct()}</dd></div><div><dt>Rest offers</dt><dd class="tn">${restOffers()}</dd></div><div><dt>Breathing</dt><dd class="tn">${breathAvg()}</dd></div></dl><p class="muted small">A break is suggested after three wrong answers in a row, or when answers slow down a lot.</p></div>
   <div class="card rv stack" style="--d:1;gap:12px"><b>Settings in use</b><div class="row" style="gap:8px">${(used.length?used:['Standard settings']).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}<span class="chip">${P.att} min lessons</span></div><p class="muted small">Change these any time in Settings.</p></div></div>
   <div class="card rv stack" style="gap:12px"><label for="notes"><b>Shared care notes</b></label><span class="muted small">For example: responds well to picture cards before lessons.</span><textarea class="in" id="notes" placeholder="Write a note for the team"></textarea></div>
   <div class="card rv stack" style="gap:12px"><b>Report summary</b><textarea class="in" id="rep" readonly style="min-height:230px"></textarea><div class="row"><button class="btn pri" id="copy">Copy summary</button><span class="muted small" id="copied" aria-live="polite"></span></div></div></div>`;
  const n=$('#notes');n.value=G.notes||'';n.oninput=()=>{G.notes=n.value;save()};
  const rp=$('#rep');rp.value=reportText();n.addEventListener('input',()=>{rp.value=reportText()});
  $('#copy').onclick=()=>{const ok=()=>$('#copied').textContent='Copied.',bad=()=>{rp.focus();rp.select();$('#copied').textContent='Selected. Use copy on your device.'};try{navigator.clipboard.writeText(rp.value).then(ok,bad)}catch(e){bad()}};
};


function cancelFlow(){
  const steps=[[`<span class="wob">${pip(84)}</span>`,'Pip is packing!','Please stay?'],[`<span style="color:var(--sun)">${ic('star',64)}</span>`,'Wait! A gift!','A gold star. A bit crooked.'],[`<span class="wob">${pip(84)}</span>`,'Pip does a sad dance.','Last chance?']];
  let i=0;
  const close=()=>{$('#overlay').innerHTML='';document.removeEventListener('keydown',esc2,true)};
  const esc2=e=>{if(e.key==='Escape')close()};
  const draw=()=>{
    const calm=calmMotion();
    if(i>=steps.length){
      P.plan='free';save(true);
      $('#overlay').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Cancelled"><div class="card stack" style="gap:14px"><div style="font-size:3.4rem;line-height:1" aria-hidden="true">${pip(84)}</div><h3>Cancelled.</h3><p class="muted">Pip waves. Your stars and garden stay safe.</p><button class="btn pri" id="cx">OK</button></div></div>`;
      $('#cx').onclick=()=>{close();if(cur==='pricing')R.pricing();reveal($('#page'))};$('#cx').focus();return;
    }
    const[e,h,t]=steps[i];
    $('#overlay').innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${h}"><div class="card stack" style="gap:14px"><div style="font-size:3.4rem;line-height:1" aria-hidden="true">${calm?e.replace('wob',''):e}</div><h3>${h}</h3><p class="muted">${t}</p><button class="btn pri lg" id="ckeep">Keep Family</button><button class="btn ghost" id="cgo">${i===steps.length-1?'Cancel now':'Still cancel'}</button></div></div>`;
    $('#ckeep').onclick=()=>{close();toast('Yay! Family stays.')};$('#ckeep').focus();
    $('#cgo').onclick=()=>{i++;draw()};
  };
  document.addEventListener('keydown',esc2,true);draw();
}
R.pricing=()=>{
  const cp=P&&P.plan||'free',on=session;
  const plans=[{id:'free',n:'Free',d:'Try it at home.',amt:'0',f:['5-minute daily lessons','Simple calm tools','Calming Corner','Picture cards and Memory'],no:['Multi-child tracking']},
   {id:'family',n:'Family',hot:1,d:'For parents and carers.',amt:'12',was:'25',u:'per month',f:['Full AI lesson paths','Unlimited Calming Corner','Multi-child tracking','Family Care Circle'],no:[]},
   {id:'school',n:'School or clinic',d:'For special education teams and clinics.',amt:'500–2,500',u:'per school, per year',f:['Full Care Circle','Automatic reports','Custom lessons'],no:[]}];
  const rows=[['Price','RM0','RM12 /month','From RM500 /year'],['Daily lessons','5 minutes','Full AI paths','Full AI paths'],['Sensory tools','Simple','Full','Full'],['Calming Corner','Included','Unlimited','Unlimited'],['Multi-child tracking','–','✓','✓'],['Care Circle','–','Family view','Full'],['Progress reports','–','–','✓']];
  const btn=p=>p.id==='free'?(cp==='free'&&on?'Your plan':'Use Free'):p.id==='family'?(cp==='family'&&on?'Cancel plan':'Try Family'):'Contact us';
  $('#page').innerHTML=`<div class="wrap stack" style="gap:30px"><div class="stack" style="gap:14px;align-items:flex-start"><h1 style="font-size:clamp(2.3rem,6vw,4.4rem)">${sp('Start free.')} <span class="hl">${sp('Grow when ready.')}</span></h1></div>
   <div class="promo rv"><span class="ti2" aria-hidden="true">${ic('star',18)}</span><span>Member price: Family RM12 <span class="was">RM25</span></span><span class="chip" style="background:var(--on-sun);color:var(--sun)">Save 52%</span></div>
   <div class="g3" style="align-items:stretch">${plans.map((p,i)=>`<div class="card glow plan rv ${p.hot?'hot':''}" style="--d:${i}"><div class="row between"><h3>${p.n}</h3>${p.hot?'<span class="chip sun">Best price</span>':''}${cp===p.id&&on&&p.id!=='school'?'<span class="chip">Your plan</span>':''}</div><p class="muted">${p.d}</p><div class="amt tn">${p.was?`<span class="was" style="font-size:1.2rem">RM${p.was}</span> `:''}<span style="font-size:1.2rem">RM</span>${p.amt}${p.u?`<small>${p.u}</small>`:''}</div><button class="btn ${p.hot&&cp!=='family'?'pri':''} lg" data-plan="${p.id}" ${p.id==='free'&&cp==='free'&&on?'disabled':''}>${btn(p)}</button><ul class="feat">${p.f.map(x=>`<li>${x}</li>`).join('')}${p.no.map(x=>`<li class="no">${x}</li>`).join('')}</ul></div>`).join('')}</div>
   <p class="muted small">Demo: no payment is taken.</p>
   <div class="stack" style="gap:14px"><h2 class="rv">Compare</h2><div class="tblw rv"><table class="cmp"><thead><tr><th></th><th>Free</th><th>Family</th><th>School or clinic</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted small">Schools and clinics may qualify for grants and funding.</p></div>
   <div class="stack" style="gap:14px"><h2 class="rv">Questions</h2><div class="rv">${[['Can I cancel any time?','Yes. Pip will be a little dramatic about it, but she will get over it.'],['Is progress kept?','Always. Plans only change which features you can use.']].map(f=>`<details class="acc"><summary>${f[0]}</summary><div class="accb"><p class="muted">${f[1]}</p></div></details>`).join('')}</div></div></div>`;
  $$('[data-plan]').forEach(b=>b.onclick=()=>{
    if(!session){go('auth-register');return}

      if(P.plan==='family'){cancelFlow();return}
      P.plan='family';save(true);R.pricing();reveal($('#page'));toast('Family on (demo)');return}
    toast('We will be in touch (demo).');
  });
};


let CONFIRM='',setTab='comfort';
const SETTABS=[['comfort','Comfort'],['helpers','Helpers'],['learn','Learning'],['account','Account']];
R.helpers=()=>{setTab='helpers';go('profile')};

  const sw=(k,l,d)=>`<button class="card flat row" style="flex-wrap:nowrap;justify-content:space-between;text-align:left;padding:14px 18px" data-pref="${k}" role="switch" aria-checked="${!!P.prefs[k]}"><span class="stack"><b>${l}</b><span class="muted small">${d}</span></span><i class="sw ${P.prefs[k]?'on':''}"></i></button>`;

   <div class="stack" style="gap:10px">${PREFS.map(([k,l,d])=>sw(k,l,d)).join('')}</div>`;
  $$('[data-th]',box).forEach(b=>b.onclick=()=>{setTheme(b.dataset.th);R.profile()});
  $$('[data-pref]',box).forEach(b=>b.onclick=()=>{const k=b.dataset.pref;P.prefs[k]=!P.prefs[k];save(true);applyA11y();R.profile();if(k==='lb')lbPush()});

function setLearn(box){

  $('#retake').onclick=()=>OB.start(P);
}
function setAccount(box){
  box.innerHTML=`<div class="card stack" style="gap:8px"><b>Where this is saved</b><p class="muted">${mode==='cloud'?'Progress is saved to your account and also on this device.':'Progress is saved on this device. Sign in to claude.ai to save it to an account.'}</p></div>
   <div class="row"><button class="btn" id="out">${ic('out',18)} Log out</button><button class="btn ghost" id="rst">${CONFIRM==='r'?'Press again to confirm':'Reset progress'}</button><button class="btn ghost" id="del" style="color:var(--warn)">${CONFIRM==='d'?'Press again to confirm':'Delete everything'}</button></div>`;

R.profile=()=>{
  hsRefresh=null;
  $('#page').innerHTML=`<div class="wrap stack" style="gap:20px;max-width:820px">
   <div class="row" style="flex-wrap:nowrap;gap:16px"><span class="av" style="width:60px;height:60px;font-size:1.5rem">${esc(P.name[0].toUpperCase())}</span><div class="stack" style="gap:2px"><h2>Settings</h2><span class="muted">${esc(P.name)} · ${P.plan==='free'?'Free plan':P.plan} · ${G.pts} stars</span></div></div>

};
